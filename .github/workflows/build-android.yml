name: Build Android App (All Variants)

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Chaquopy 需要 Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ==================== 签名准备 ====================
      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

      # ==================== 构建并签名所有 Release 变体 ====================
      - name: Build and Sign All Release APKs
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # ==================== 构建所有 Release AAB（未签名） ====================
      - name: Build All Release AABs
        run: ./gradlew bundleRelease

      # ==================== 上传所有已签名的 Release APK ====================
      - name: Upload Signed Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-signed-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn

      # ==================== 上传所有 Release AAB（未签名） ====================
      - name: Upload Release AABs (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: all-release-aabs
          path: app/build/outputs/bundle/release/**/*.aab
          if-no-files-found: warn

      # ==================== 可选：列出生成的产物（调试时打开） ====================
      # - name: List generated files
      #   run: |
      #     echo "=== Signed APKs ==="
      #     find app/build/outputs/apk -type f -name "*.apk" | sort
      #     echo "=== AABs ==="
      #     find app/build/outputs/bundle -type f -name "*.aab" | sort
name: Build Android App (Mobile Only)

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build-mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ==================== 签名准备 ====================
      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

      # ==================== 正确任务名：mobile + ABI（mode 在前） ====================
      - name: Build and Sign Mobile Release APKs
        run: |
          ./gradlew mobileArm64_v8aRelease mobileArmeabi_v7aRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # ==================== 构建 mobile AAB（未签名） ====================
      - name: Build Mobile Release AAB
        run: ./gradlew mobileBundleRelease

      # ==================== 上传已签名的 mobile APK ====================
      - name: Upload Signed Mobile APKs
        uses: actions/upload-artifact@v4
        with:
          name: mobile-signed-apks
          path: |
            app/build/outputs/apk/mobileArm64_v8a/release/mobile-arm64_v8a.apk
            app/build/outputs/apk/mobileArmeabi_v7a/release/mobile-armeabi_v7a.apk
          if-no-files-found: error

      # ==================== 上传 mobile AAB ====================
      - name: Upload Mobile AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release.aab
          path: app/build/outputs/bundle/mobileRelease/mobile-release.aab
          if-no-files-found: error
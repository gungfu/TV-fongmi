name: Build Android App

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APKs (all ABIs)
        run: ./gradlew assembleDebug

      - name: Build Release APKs (unsigned, all ABIs)
        run: ./gradlew assembleRelease

      - name: Build Release AAB (unsigned)
        run: ./gradlew bundleRelease

      # 上传所有 Debug APK（按 ABI 分开）
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk

      # 上传所有 Release APK（未签名）
      - name: Upload Release APKs (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-unsigned
          path: app/build/outputs/apk/release/*.apk

      # 上传 AAB（通常只有一个）
      - name: Upload Release AAB (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab